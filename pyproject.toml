[project]
name = "workflow"
version = "0.1.0"
description = "Telegram time-tracking bot"
authors = [
    {name = "Mimystery", email = "vlad1503kudyrko@gmail.com"}
]
requires-python = ">=3.14"
dependencies = [
    "python-telegram-bot>=22.0",
    "sqlalchemy>=2.0.45",
    "asyncpg>=0.31.0",
    "alembic>=1.17.0",
    "pydantic-settings>=2.12.0",
    "pydantic>=2.12.0",
    "python-dotenv>=1.1.0",
]


[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
